[project]
name = "comfyui-pose-gallery"
version = "0.3.0"
description = "Online pose-reference gallery for ComfyUI with Chinese and Japanese sources."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "icefox57" }]
dependencies = ["Pillow>=9.1.0", "numpy>=1.23.0", "aiohttp>=3.8.0"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/icefox57/ComfyUI-Pose-Gallery"
Issues = "https://github.com/icefox57/ComfyUI-Pose-Gallery/issues"

[tool.comfy]
DisplayName = "ComfyUI Pose Gallery"
