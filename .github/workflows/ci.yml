name: Checks

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Pillow numpy aiohttp
      - run: python -m unittest discover -s tests -v
      - run: node --check web/pose_gallery.js
      - run: node --test tests/frontend.test.mjs
      - run: python -m compileall -q __init__.py nodes.py pose_gallery_service.py
